[tool:pytest]
# Configuration for pytest runs
minversion = 6.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=evaluation_engine.config
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=80
testpaths = 
    evaluation_engine/tests/config
    evaluation_engine/tests/integration
    evaluation_engine/tests/cli
    evaluation_engine/tests/api
    evaluation_engine/tests/performance
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    unit: marks tests as unit tests
    cli: marks tests as CLI tests
    api: marks tests as API tests
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning