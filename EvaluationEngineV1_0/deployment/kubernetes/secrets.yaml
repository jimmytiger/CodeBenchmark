apiVersion: v1
kind: Secret
metadata:
  name: evaluation-engine-secrets
  namespace: evaluation-engine
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  # To encode: echo -n "your-secret" | base64
  SECRET_KEY: eW91ci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u  # your-secret-key-change-in-production
  JWT_SECRET: eW91ci1qd3Qtc2VjcmV0LWNoYW5nZS1pbi1wcm9kdWN0aW9u  # your-jwt-secret-change-in-production
  DB_PASSWORD: ZXZhbF9wYXNzd29yZA==  # eval_password
  REDIS_PASSWORD: cmVkaXNfcGFzc3dvcmQ=  # redis_password

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: evaluation-engine
type: Opaque
data:
  POSTGRES_PASSWORD: ZXZhbF9wYXNzd29yZA==  # eval_password
  POSTGRES_USER: ZXZhbF91c2Vy  # eval_user
  POSTGRES_DB: ZXZhbHVhdGlvbl9lbmdpbmU=  # evaluation_engine

---
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret
  namespace: evaluation-engine
type: kubernetes.io/tls
data:
  # Replace with your actual TLS certificate and key
  # To generate self-signed certificate for testing:
  # openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj "/CN=evaluation-engine"
  # cat tls.crt | base64 -w 0
  # cat tls.key | base64 -w 0
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCi4uLgotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0t
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCi4uLgotLS0tLUVORCBQUklWQVRFIEtFWS0tLS0t

---
# Service account for the application
apiVersion: v1
kind: ServiceAccount
metadata:
  name: evaluation-engine-sa
  namespace: evaluation-engine
automountServiceAccountToken: true

---
# Role for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: evaluation-engine
  name: evaluation-engine-role
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
# Role binding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: evaluation-engine-rolebinding
  namespace: evaluation-engine
subjects:
- kind: ServiceAccount
  name: evaluation-engine-sa
  namespace: evaluation-engine
roleRef:
  kind: Role
  name: evaluation-engine-role
  apiGroup: rbac.authorization.k8s.io