apiVersion: v1
kind: Namespace
metadata:
  name: evaluation-engine
  labels:
    name: evaluation-engine
    app: multi-turn-evaluation-engine
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: evaluation-engine-quota
  namespace: evaluation-engine
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "10"
    configmaps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: evaluation-engine-limits
  namespace: evaluation-engine
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container