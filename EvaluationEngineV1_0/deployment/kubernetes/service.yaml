apiVersion: v1
kind: Service
metadata:
  name: evaluation-engine-service
  namespace: evaluation-engine
  labels:
    app: evaluation-engine
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics
  selector:
    app: evaluation-engine
    component: api

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: evaluation-engine
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: evaluation-engine
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis

---
# Headless service for StatefulSet (if needed for clustering)
apiVersion: v1
kind: Service
metadata:
  name: evaluation-engine-headless
  namespace: evaluation-engine
  labels:
    app: evaluation-engine
spec:
  clusterIP: None
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: evaluation-engine
    component: api

---
# LoadBalancer service for external access (optional)
apiVersion: v1
kind: Service
metadata:
  name: evaluation-engine-lb
  namespace: evaluation-engine
  labels:
    app: evaluation-engine
    component: loadbalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8000
    protocol: TCP
    name: https
  selector:
    app: evaluation-engine
    component: api
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300

---
# Ingress for HTTP/HTTPS routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evaluation-engine-ingress
  namespace: evaluation-engine
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - evaluation-engine.your-domain.com
    - api.evaluation-engine.your-domain.com
    secretName: evaluation-engine-tls
  rules:
  - host: evaluation-engine.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: evaluation-engine-service
            port:
              number: 8000
  - host: api.evaluation-engine.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: evaluation-engine-service
            port:
              number: 8000

---
# Service Monitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: evaluation-engine-metrics
  namespace: evaluation-engine
  labels:
    app: evaluation-engine
spec:
  selector:
    matchLabels:
      app: evaluation-engine
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    honorLabels: true